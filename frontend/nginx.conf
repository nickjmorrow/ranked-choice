server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No version in error pages or the Server header: it tells a scanner which
    # CVEs to try and tells nobody else anything.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers, on every response from this server — and ONLY declared
    # here. nginx's `add_header` does not merge: a location with an
    # `add_header` of its own silently drops every one of these for the files
    # it serves, which is why /assets/ below caches with `expires` instead.
    #
    # The CSP is strict because the app lets it be: every script is a file
    # from this origin (the theme bootstrap included — see public/theme.js),
    # styles are one stylesheet, and the API is same-origin. Inline `style`
    # values the app sets (bar widths, drag positions) are set through the
    # CSSOM, which `style-src 'self'` does not govern.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is deliberately not set here. It belongs to whatever terminates TLS
    # in front of this container, which is the only thing that knows the site
    # is HTTPS at all.

    # Single-page app: every path that is not a real file is the app's own
    # route, so it gets index.html and the client decides what to render.
    #
    # `expires -1` (no-cache): index.html names the current hashed bundle, and
    # a copy a browser kept after a deploy points at assets that no longer
    # exist — a blank page until a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # The built bundle calls /api on its own origin — exactly as it does in dev,
    # where Vite's dev server proxies it. One origin, no CORS, and no API URL
    # compiled into the JavaScript.
    location /api/ {
        # Through a variable, with Docker's embedded DNS, so `backend` is looked
        # up again rather than once: redeploy the backend alone and it comes
        # back on a new IP, which a literal proxy_pass would never notice.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Poll results are live data; never let anything between here and the
        # browser keep a copy.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed filenames, so these can never be stale.
    location /assets/ {
        expires 1y;
    }
}
